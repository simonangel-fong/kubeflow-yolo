apiVersion: v1
kind: Pod
metadata:
  name: mount-check
spec:
  restartPolicy: Never
  containers:
    - name: c
      image: busybox:1.36
      command: ["sh", "-c", "ls -la /data/raw | head -5"]
      volumeMounts:
        - name: d
          mountPath: /data
          readOnly: true
  volumes:
    - name: d
      hostPath:
        path: /data
        type: Directory
