# YOLO notebook server.
#
#   kubectl apply -f kind/notebook.yaml
#
# The controller derives a Deployment, Service and VirtualService from this.
# Reachable at /notebook/kubeflow/yolo/ through the istio ingressgateway.
#
# /home/jovyan/work  writable PVC, survives restarts
# /home/jovyan/data  the host data/ directory, read-only (see kind/data-pv.yaml)

apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: yolo
  namespace: kubeflow
spec:
  template:
    spec:
      serviceAccountName: default-editor
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notebook
          image: kubeflownotebookswg/jupyter-scipy:v1.9.2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: workspace
              mountPath: /home/jovyan/work
            - name: data
              mountPath: /home/jovyan/data
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: yolo-workspace
        - name: data
          persistentVolumeClaim:
            claimName: yolo-data
            readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yolo-workspace
  namespace: kubeflow
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
