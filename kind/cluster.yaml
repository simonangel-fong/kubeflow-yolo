kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: desktop

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraMounts:
      - hostPath: /run/desktop/mnt/host/c/Users/simon/OneDrive/Tech/Github/kubeflow-yolo/data
        containerPath: /data
        readOnly: true
    # istio-ingressgateway is a NodePort on 30080/30443 -- the default
    # --service-node-port-range is 30000-32767, so it cannot bind 80/443
    # directly. See argocd/apps/05-istio-install.yaml.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
