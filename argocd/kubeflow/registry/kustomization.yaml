# Model registry (per-tenant) + model catalog (cluster-wide singleton).
# registry.yaml is vendored: the upstream overlay hardcodes the demo namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - registry.yaml
  - https://github.com/kubeflow/community-distribution//applications/hub/overlays/model-catalog?ref=26.03.1
