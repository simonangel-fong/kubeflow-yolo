# Serving infra: upstream ingressgateway (Kubeflow policies hardcode
# ns/istio-system + sa/istio-ingressgateway-service-account), Knative, and the
# cluster-local gateway KServe needs. istiod/cert-manager come from argocd/init.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingressgateway.yaml
  - https://github.com/kubeflow/community-distribution//common/knative/knative-serving/overlays/gateways?ref=26.03.1
  - https://github.com/kubeflow/community-distribution//common/istio/cluster-local-gateway/base?ref=26.03.1
