# Serving infrastructure Kubeflow depends on:
#   - the upstream ingress gateway in istio-system. Every Kubeflow
#     AuthorizationPolicy/NetworkPolicy/Gateway hardcodes ns/istio-system,
#     sa/istio-ingressgateway-service-account and app=istio-ingressgateway,
#     so the upstream gateway is kept rather than retargeting every policy.
#   - Knative Serving + cluster-local gateway, required by KServe.
# istiod, istio-cni and cert-manager come from argocd/init, NOT from here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingressgateway.yaml
  - https://github.com/kubeflow/community-distribution//common/knative/knative-serving/overlays/gateways?ref=26.03.1
  - https://github.com/kubeflow/community-distribution//common/istio/cluster-local-gateway/base?ref=26.03.1
