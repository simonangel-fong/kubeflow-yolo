# Resources the community-charts/mlflow chart does not provide: the Postgres
# backend store, Istio routing, and the NetworkPolicies kubeflow requires.
# The MLflow server itself comes from the chart (see argocd/init/kubeflow-mlflow.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - postgres.yaml
  - routing.yaml
