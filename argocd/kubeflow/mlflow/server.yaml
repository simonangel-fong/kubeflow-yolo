apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow
  namespace: kubeflow
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: kubeflow
spec:
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: kubeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      serviceAccountName: mlflow
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.1.4
          command: ["/bin/sh", "-c"]
          # psycopg2 is not in the base image; install then start.
          args:
            - |
              pip install --no-cache-dir psycopg2-binary boto3 >/dev/null &&
              exec mlflow server \
                --host 0.0.0.0 --port 5000 \
                --backend-store-uri "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@mlflow-postgres.kubeflow.svc.cluster.local:5432/mlflow" \
                --default-artifact-root "s3://${ARTIFACT_BUCKET}/mlflow/"
          ports:
            - containerPort: 5000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mlflow-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-postgres
                  key: password
            - name: ARTIFACT_BUCKET
              value: kubeflow-yolo-dev-099139718958
            - name: AWS_DEFAULT_REGION
              value: ca-central-1
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
