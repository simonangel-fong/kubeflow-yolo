# Kubeflow essential layer: everything required for a working UI.
#   - oauth2-proxy + dex (the ext-authz filter calls oauth2-proxy over mTLS,
#     so both namespaces must be in the mesh; upstream does not label them)
#   - kubeflow/kubeflow-system namespaces, cluster roles
#   - kubeflow-gateway + auth policies every component binds to
#   - central dashboard, profile controller, poddefaults webhook
# The demo profile (common/user-namespace, user@example.com) is deliberately
# NOT included; the project tenant is argocd/kubeflow/tenant.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # auth
  - https://github.com/kubeflow/community-distribution//common/oauth2-proxy/overlays/m2m-dex-and-eks?ref=26.03.1
  - https://github.com/kubeflow/community-distribution//common/dex/overlays/oauth2-proxy?ref=26.03.1
  # namespaces, roles, istio resources
  - https://github.com/kubeflow/community-distribution//common/kubeflow-namespace/base?ref=26.03.1
  - https://github.com/kubeflow/community-distribution//common/kubeflow-roles/base?ref=26.03.1
  - https://github.com/kubeflow/community-distribution//common/istio/kubeflow-istio-resources/base?ref=26.03.1
  # dashboard
  - https://github.com/kubeflow/community-distribution//applications/dashboard/overlays/istio?ref=26.03.1

patches:
  # Replace the demo account (user@example.com, whose password is the
  # well-known "12341234") with the project owner. The password still comes
  # from DEX_USER_PASSWORD in the dex-passwords secret; no hash is committed.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: dex
        namespace: auth
      data:
        config.yaml: |
          issuer: http://dex.auth.svc.cluster.local:5556/dex
          storage:
            type: kubernetes
            config:
              inCluster: true
          web:
            http: 0.0.0.0:5556
          logger:
            level: "debug"
            format: text
          oauth2:
            skipApprovalScreen: true
          enablePasswordDB: true
          staticPasswords:
          - email: simonangelfong@gmail.com
            hashFromEnv: DEX_USER_PASSWORD
            username: simonangelfong
            userID: "15841185641784"
          staticClients:
          - idEnv: OIDC_CLIENT_ID
            redirectURIs: ["/oauth2/callback"]
            name: 'Dex Login Application'
            secretEnv: OIDC_CLIENT_SECRET
  - patch: |-
      - op: add
        path: /metadata/labels/istio-injection
        value: enabled
    target:
      version: v1
      kind: Namespace
      name: oauth2-proxy
  - patch: |-
      - op: add
        path: /metadata/labels/istio-injection
        value: enabled
    target:
      version: v1
      kind: Namespace
      name: auth
  # m2m-dex-and-eks ships a placeholder issuer
  - patch: |-
      - op: replace
        path: /spec/jwtRules/0/issuer
        value: https://oidc.eks.ca-central-1.amazonaws.com/id/AC93E97B9D09852BC7D9FDDCAF5D12AF
    target:
      group: security.istio.io
      kind: RequestAuthentication
      name: m2m-token-issuer
      namespace: istio-system
