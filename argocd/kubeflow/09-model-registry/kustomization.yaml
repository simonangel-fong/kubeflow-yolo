kind: Kustomization

resources:
  - https://github.com/kubeflow/community-distribution//applications/hub/overlays/model-registry?ref=26.03.1
  - https://github.com/kubeflow/community-distribution//applications/hub/overlays/model-catalog?ref=26.03.1
