# Kubeflow essential layer: auth (oauth2-proxy + dex), namespaces/roles,
# kubeflow-gateway, and the central dashboard. Everything needed for a
# working UI; the feature components (pipelines, notebooks, serving,
# registry, katib) sync after this.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-core
  namespace: argocd
  labels:
    scope: kubeflow
    capability: ml-platform
  annotations:
    argocd.argoproj.io/sync-wave: "31"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/simonangel-fong/kubeflow-yolo
    targetRevision: master
    path: argocd/kubeflow/core
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow
  ignoreDifferences:
    # Aggregated ClusterRoles: git declares an aggregationRule with empty
    # rules; the RBAC controller populates .rules, so git never matches.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kubeflow-admin
      jsonPointers:
        - /rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kubeflow-edit
      jsonPointers:
        - /rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kubeflow-view
      jsonPointers:
        - /rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kubeflow-istio-admin
      jsonPointers:
        - /rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: poddefaults-webhook-kubeflow-poddefaults-admin
      jsonPointers:
        - /rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: poddefaults-webhook-kubeflow-poddefaults-edit
      jsonPointers:
        - /rules
    # cert-manager's CA injector writes caBundle into the poddefaults webhook
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
