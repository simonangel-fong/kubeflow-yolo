# Notebooks v1: jupyter, volumes, tensorboards, pvcviewer.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-notebooks
  namespace: argocd
  labels:
    scope: kubeflow
    capability: ml-platform
  annotations:
    argocd.argoproj.io/sync-wave: "35"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/simonangel-fong/kubeflow-yolo
    targetRevision: master
    path: argocd/kubeflow/notebooks
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: notebook-controller-kubeflow-notebooks-admin
      jsonPointers:
        - /rules
    # apiserver drops preserveUnknownFields in v1
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: notebooks.kubeflow.org
      jsonPointers:
        - /spec/preserveUnknownFields
    # cert-manager's CA injector writes caBundle into the pvcviewer webhooks
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
