# kubeflow step 3: namespace, cluster roles, kubeflow-gateway + auth policies.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-03-core
  namespace: argocd
  labels:
    scope: kubeflow
    capability: ml-platform
  annotations:
    argocd.argoproj.io/sync-wave: "32"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/simonangel-fong/kubeflow-yolo
    targetRevision: master
    path: argocd/kubeflow/03-kubeflow-core
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow
  ignoreDifferences:
    # These four declare an aggregationRule with empty rules; the RBAC
    # controller populates .rules, so git can never match the live object.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kubeflow-admin
      jsonPointers:
        - /rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kubeflow-edit
      jsonPointers:
        - /rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kubeflow-view
      jsonPointers:
        - /rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kubeflow-istio-admin
      jsonPointers:
        - /rules
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
