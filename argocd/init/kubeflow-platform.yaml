# Serving infrastructure: upstream ingress gateway (istio-system) +
# Knative Serving + cluster-local gateway. Prerequisite for everything else.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-platform
  namespace: argocd
  labels:
    scope: kubeflow
    capability: ml-platform
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/simonangel-fong/kubeflow-yolo
    targetRevision: master
    path: argocd/kubeflow/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: knative-serving
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: knative-serving-admin
      jsonPointers:
        - /rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: knative-serving-aggregated-addressable-resolver
      jsonPointers:
        - /rules
    # Knative's webhook controller rewrites these at runtime: git ships a single
    # placeholder rule and no caBundle; the controller populates the real rule
    # set (10 rules), the CA bundle and the reinvocation/failure policies.
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
        - .webhooks[].rules
        - .webhooks[].reinvocationPolicy
        - .webhooks[].failurePolicy
        - .webhooks[].namespaceSelector
        - .webhooks[].objectSelector
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
        - .webhooks[].rules
        - .webhooks[].failurePolicy
        - .webhooks[].namespaceSelector
        - .webhooks[].objectSelector
    # knative operator writes defaults into its configmaps
    - kind: ConfigMap
      namespace: knative-serving
      jqPathExpressions:
        - .data._example
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
