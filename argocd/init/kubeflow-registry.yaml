# kubeflow step 9: model registry (per-user namespace) + model catalog (cluster-wide).
# Both Postgres-backed; PVCs land on the default gp3 StorageClass.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-registry
  namespace: argocd
  labels:
    scope: kubeflow
    capability: ml-platform
  annotations:
    argocd.argoproj.io/sync-wave: "37"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/simonangel-fong/kubeflow-yolo
    targetRevision: master
    path: argocd/kubeflow/registry
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow
  ignoreDifferences:
    - kind: PersistentVolumeClaim
      jqPathExpressions:
        - .spec.volumeName
        - .spec.volumeMode
  syncPolicy:
    automated:
      # prune disabled: this app's overlay targets kubeflow-user-example-com,
      # a user profile namespace. With prune on, Argo deletes user-created
      # Notebooks/InferenceServices there because they are not in git.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
