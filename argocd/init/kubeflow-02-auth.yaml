# kubeflow step 2: oauth2-proxy + dex.
# Requires meshConfig.extensionProviders[oauth2-proxy] on istiod
# (see argocd/istio/istiod.yaml) for the ext-authz filter to resolve.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-02-auth
  namespace: argocd
  labels:
    scope: kubeflow
    capability: security
  annotations:
    argocd.argoproj.io/sync-wave: "31"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/simonangel-fong/kubeflow-yolo
    targetRevision: master
    path: argocd/kubeflow/02-auth
  destination:
    server: https://kubernetes.default.svc
    namespace: oauth2-proxy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
