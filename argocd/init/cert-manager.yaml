# cert-manager.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cert-manager
  namespace: argocd
  labels:
    scope: platform
    capability: security
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.1
    helm:
      releaseName: cert-manager
      values: |
        crds:
          enabled: true
          keep: true
        nodeSelector:
          workload-class: platform
        tolerations:
          - key: workload-class
            operator: Equal
            value: platform
            effect: NoSchedule
        webhook:
          nodeSelector:
            workload-class: platform
          tolerations:
            - key: workload-class
              operator: Equal
              value: platform
              effect: NoSchedule
        cainjector:
          nodeSelector:
            workload-class: platform
          tolerations:
            - key: workload-class
              operator: Equal
              value: platform
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
