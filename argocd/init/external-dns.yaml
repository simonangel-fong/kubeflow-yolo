apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-external-dns
  namespace: argocd
  labels:
    scope: platform
    capability: network
  annotations:
    argocd.argoproj.io/sync-wave: "19"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns
    chart: external-dns
    targetRevision: 1.21.1
    helm:
      releaseName: external-dns
      values: |
        replicaCount: 2
        podDisruptionBudget:
          minAvailable: 1
        provider:
          name: cloudflare
        sources:
          - gateway-httproute
        domainFilters:
          - arguswatcher.net
        policy: sync
        registry: txt
        txtOwnerId: kubeflow-yolo-dev
        txtPrefix: "extdns-"
        env:
          - name: CF_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: cloudflare-api-token
                key: api-token
        extraArgs:
          - --cloudflare-dns-records-per-page=1000
        serviceAccount:
          create: true
          name: external-dns
        rbac:
          create: true
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 128Mi
        nodeSelector:
          workload-class: platform
        tolerations:
          - key: workload-class
            operator: Equal
            value: platform
            effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
