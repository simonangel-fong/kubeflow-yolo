# kubeflow step 7: Knative Serving + cluster-local gateway (KServe prerequisite).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-07-knative
  namespace: argocd
  labels:
    scope: kubeflow
    capability: ml-platform
  annotations:
    argocd.argoproj.io/sync-wave: "36"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/simonangel-fong/kubeflow-yolo
    targetRevision: master
    path: argocd/kubeflow/07-knative
  destination:
    server: https://kubernetes.default.svc
    namespace: knative-serving
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: knative-serving-admin
      jsonPointers:
        - /rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: knative-serving-aggregated-addressable-resolver
      jsonPointers:
        - /rules
    # knative's own webhook controller writes caBundle into its webhook configs
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    # knative operator writes defaults into its configmaps
    - kind: ConfigMap
      namespace: knative-serving
      jqPathExpressions:
        - .data._example
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
