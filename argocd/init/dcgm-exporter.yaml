# NVIDIA DCGM exporter: per-GPU utilization, memory, temperature and power.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-dcgm-exporter
  namespace: argocd
  labels:
    scope: platform
    capability: observability
  annotations:
    argocd.argoproj.io/sync-wave: "21"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://nvidia.github.io/dcgm-exporter/helm-charts
    chart: dcgm-exporter
    targetRevision: 4.8.3
    helm:
      releaseName: dcgm-exporter
      values: |
        nodeSelector:
          workload-class: gpu
        tolerations:
          - key: workload-class
            operator: Equal
            value: gpu
            effect: NoSchedule
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule

        serviceMonitor:
          enabled: true
          interval: 15s
          scrapeTimeout: 10s
          honorLabels: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
