# NVIDIA DCGM exporter: per-GPU utilization, memory, temperature and power.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-dcgm-exporter
  namespace: argocd
  labels:
    scope: platform
    capability: observability
  annotations:
    argocd.argoproj.io/sync-wave: "21"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://nvidia.github.io/dcgm-exporter/helm-charts
    chart: dcgm-exporter
    targetRevision: 4.8.3
    helm:
      releaseName: dcgm-exporter
      values: |
        nodeSelector:
          workload-class: gpu
        tolerations:
          - key: workload-class
            operator: Equal
            value: gpu
            effect: NoSchedule
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule

        serviceMonitor:
          enabled: true
          # scrapeTimeout must stay below interval; the chart defaults to
          # 30s/25s, so both are set together rather than interval alone.
          interval: 15s
          scrapeTimeout: 10s
          # honorLabels keeps the exporter's own pod/namespace attribution,
          # which is what maps a GPU back to the Katib trial using it.
          honorLabels: true
          # DCGM 4.x emits the node as lowercase `hostname`, but the community
          # GPU dashboards (12239, 14574) query `Hostname`, and the Kubernetes
          # ones (23382, 17603) query `node` -- both render empty without these.
          # Copying rather than renaming keeps `hostname` intact for anything
          # already using it.
          relabelings:
            - sourceLabels: [__meta_kubernetes_pod_node_name]
              targetLabel: Hostname
              action: replace
            - sourceLabels: [__meta_kubernetes_pod_node_name]
              targetLabel: node
              action: replace

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
