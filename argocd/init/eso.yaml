apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-eso
  namespace: argocd
  labels:
    scope: platform
    capability: security
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.7.0
    helm:
      releaseName: external-secrets
      values: |
        installCRDs: true
        serviceAccount:
          create: true
          name: external-secrets
        replicaCount: 2
        nodeSelector:
          workload-class: platform
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
        tolerations:
          - key: workload-class
            operator: Equal
            value: platform
            effect: NoSchedule
        webhook:
          nodeSelector:
            workload-class: platform
          replicaCount: 2
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          tolerations:
            - key: workload-class
              operator: Equal
              value: platform
              effect: NoSchedule
        certController:
          nodeSelector:
            workload-class: platform
          replicaCount: 2
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          tolerations:
            - key: workload-class
              operator: Equal
              value: platform
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
