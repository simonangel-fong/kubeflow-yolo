# MLflow tracking server (community-charts). Tracking only: the Kubeflow
# Model Registry stays authoritative for models.
# Postgres creds come from the ESO-delivered mlflow-postgres secret via
# backendStore.existingDatabaseSecret; S3 uses Pod Identity on the SA, so no
# credentials are committed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-mlflow
  namespace: argocd
  labels:
    scope: kubeflow
    capability: ml-platform
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://community-charts.github.io/helm-charts
      chart: mlflow
      targetRevision: 1.11.5
      helm:
        releaseName: mlflow
        values: |
          serviceAccount:
            create: true
            name: mlflow
          # the kubeflow namespace enforces PodSecurity "restricted"; the chart
          # sets everything except seccompProfile
          podSecurityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          backendStore:
            databaseMigration: true
            databaseConnectionCheck: true
            postgres:
              enabled: true
              host: mlflow-postgres.kubeflow.svc.cluster.local
              port: 5432
              database: mlflow
              driver: psycopg2
            existingDatabaseSecret:
              name: mlflow-postgres
              usernameKey: username
              passwordKey: password
          artifactRoot:
            s3:
              enabled: true
              bucket: kubeflow-yolo-dev-099139718958
              path: mlflow
          # MLflow 3.5+ ships DNS-rebinding protection that validates the Host
          # header; the kubelet probes hit the pod IP and the gateway forwards
          # the external host, none of which are in the default allow-list.
          # Access is already gated by the istio gateway + oauth2-proxy.
          extraFlags:
            - disableSecurityMiddleware
          extraEnvVars:
            AWS_DEFAULT_REGION: ca-central-1
          # MLflow 3.15 forks 4 uvicorn workers, each loading the full app;
          # 2Gi was OOMKilled. One worker keeps the footprint predictable for
          # a single-tenant tracking server.
          extraArgs:
            workers: "2"
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 4Gi
    # Postgres StatefulSet + VirtualService + NetworkPolicies
    - repoURL: https://github.com/simonangel-fong/kubeflow-yolo
      targetRevision: master
      path: argocd/kubeflow/mlflow
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow
  ignoreDifferences:
    # The chart ships mlflow-flask-server-secret-key as a Helm pre-install hook
    # with hook-delete-policy=before-hook-creation. Argo honours that and
    # deletes it, so the init container starts with no secret. ESO owns the
    # secret instead (argocd/eso/external-secret-mlflow-flask.yaml); ignore the
    # chart's copy entirely.
    - kind: Secret
      name: mlflow-flask-server-secret-key
      jsonPointers:
        - /data
    # bound by the provisioner
    - kind: PersistentVolumeClaim
      jqPathExpressions:
        - .spec.volumeName
        - .spec.volumeMode
    # apiserver defaults apiVersion/kind into volumeClaimTemplates, which git
    # omits; the field is immutable so this can never converge otherwise
    - group: apps
      kind: StatefulSet
      name: mlflow-postgres
      jqPathExpressions:
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
        - .spec.volumeClaimTemplates[].status
        - .spec.volumeClaimTemplates[].metadata.creationTimestamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
