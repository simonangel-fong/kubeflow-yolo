# Full TrainJob -- the real run, all pairs in data/raw at configs/train.yaml
# epochs. Takes considerably longer than the smoke job; expect non-zero mAP50.
#
# Writes to its own project and artifacts paths so the smoke run's output
# stays intact for comparison.
#
# A TrainJob's spec is immutable, so re-running means deleting first:
#   kubectl -n kubeflow delete trainjob yolo-full

apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: yolo-full
  namespace: kubeflow
spec:
  runtimeRef:
    name: yolo-cpu
    apiGroup: trainer.kubeflow.org
    kind: TrainingRuntime

  trainer:
    image: simonangelfong/kubeflow-yolo-train:v0.1.1-cpu
    command:
      - python
      - -m
      - trainjob.train
    args:
      - --raw=/data/raw
      - --processed=/workspace/full/processed
      - --data-yaml=/workspace/full/data.yaml
      - --project=/workspace/full/runs
      - --artifacts=/workspace/full/artifacts
      - --name=full-train
