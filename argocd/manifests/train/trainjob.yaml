# Smoke TrainJob -- proves the image, mounts and runtime line up.
#
# --limit 20 --epochs 1 finishes in a couple of minutes and is expected to
# score 0.0; it exercises the plumbing, not the model. The full run comes
# from a copy of this with the two flags dropped.
#
# A TrainJob's spec is immutable, so re-running means deleting first:
#   kubectl -n kubeflow delete trainjob yolo-smoke

apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: yolo-smoke
  namespace: kubeflow
spec:
  runtimeRef:
    name: yolo-cpu
    apiGroup: trainer.kubeflow.org
    kind: TrainingRuntime

  trainer:
    image: simonangelfong/kubeflow-yolo-train:v0.1.0-cpu
    command:
      - python
      - -m
      - trainjob.train
    args:
      - --raw=/data/raw
      - --processed=/workspace/processed
      - --data-yaml=/workspace/data.yaml
      - --project=/workspace/runs
      - --artifacts=/workspace/artifacts
      - --limit=20
      - --epochs=1
