# Allow the ingress gateway to reach notebook pods.
#
#   Synced by argocd/apps/09-notebook-policy.yaml
#
# kubeflow ships default-allow-same-namespace, a podSelector:{} policy that
# permits ingress only from within the namespace -- a default-deny for the
# gateway in istio-system. Upstream pairs it with a per-component allow for
# each web app; notebooks are created at runtime and have none.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notebooks-allow-ingressgateway
  namespace: kubeflow
spec:
  podSelector:
    matchExpressions:
      # Any notebook, not just yolo -- the controller sets notebook-name on
      # every Notebook's pod.
      - key: notebook-name
        operator: Exists
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
