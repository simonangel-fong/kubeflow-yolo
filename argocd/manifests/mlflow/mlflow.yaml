# MLflow tracking server.
#
#   Synced by argocd/apps/15-mlflow.yaml
#
# Backend store and artifact store both live on one PVC:
#
#   /mlflow/mlflow.db    SQLite, the backend store (runs, params, metrics)
#   /mlflow/artifacts    the artifact root (weights, plots, confusion matrix)
#
# SQLite rather than Postgres because this is a single-user kind cluster
# logging one training run at a time. The backend store has to be a database
# rather than a plain directory -- the model registry does not work against a
# file store -- but it does not have to be a server.
#
# One replica, and not more: SQLite over a ReadWriteOnce volume tolerates
# exactly one writer. The Recreate strategy below matters for the same reason.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow
  namespace: mlflow
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlflow
spec:
  replicas: 1
  # RollingUpdate would briefly run a second pod against the same RWO volume
  # and the same SQLite file. Recreate tears the old one down first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      securityContext:
        # The image sets no USER and would otherwise run as root, which the
        # namespace's restricted PSS label rejects.
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.15.1
          # The image's CMD is a bare python3 REPL, so the command is spelled
          # out here. --serve-artifacts routes artifact upload and download
          # through the server, so clients need no shared filesystem and no
          # object store credentials -- they only ever talk to MLFLOW_TRACKING_URI.
          command:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5000
            - --backend-store-uri=sqlite:////mlflow/mlflow.db
            - --serve-artifacts
            - --artifacts-destination=file:///mlflow/artifacts
            # Serve every route and asset under /mlflow, so the UI can be
            # reached through the shared gateway on a path prefix rather than
            # a catch-all. The VirtualService therefore does NOT rewrite --
            # the server expects the prefix to still be there.
            #
            # This moves the REST API too, so clients need the prefix in the
            # tracking URI -- not just the browser:
            #
            #   MLFLOW_TRACKING_URI=http://mlflow.mlflow.svc.cluster.local/mlflow
            #
            # Without it the client hits /api/2.0/... and gets a 404.
            - --static-prefix=/mlflow
            # Default is 4 uvicorn workers (server/__init__.py: `workers or
            # 4`), each a full copy of the Python stack -- together they went
            # over a 1Gi limit and the container was OOMKilled mid-startup.
            # One worker is the right count regardless: the backend store is
            # SQLite on an RWO volume, which wants a single writer.
            - --workers=1
            # MLflow 3.x validates the Host header against localhost and
            # private IPs to blunt DNS rebinding, and 403s anything else --
            # so the notebook (Service DNS) and the browser (via the gateway)
            # are both refused unless their names are listed here.
            #
            # Setting this *replaces* the default rather than adding to it,
            # which drops the private-IP allowance the kubelet relies on: it
            # probes by pod IP, and losing that put the container in a
            # CrashLoop on 403. Wildcards are supported; '*' would work but is
            # wider than anything here needs.
            #
            # The pod CIDR is cluster-specific, so both are listed and the
            # manifest stays portable between them:
            #
            #   mlflow.mlflow[.svc.cluster.local]  in-cluster clients
            #   localhost:8080                     kind's host port mapping
            #   10.244.*                           kubelet probes on kind
            #   10.0.*                             kubelet probes on EKS, whose
            #                                      VPC CNI assigns pod IPs from
            #                                      the VPC CIDR 10.0.0.0/16
            - --allowed-hosts=mlflow,mlflow.mlflow,mlflow.mlflow.svc,mlflow.mlflow.svc.cluster.local,localhost,localhost:8080,10.244.*,10.0.*
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: 512Mi
            limits:
              cpu: "1"
              # Measured ~1.6Gi idle with a single worker on this cluster --
              # MLflow 3.x pulls in a large dependency tree. 3Gi leaves room
              # for artifact upload, which buffers through the server. The
              # original 1Gi was what OOMKilled the container.
              memory: 3Gi
          # Holds the other two off until the server answers once. First boot
          # runs the schema migration against an empty SQLite file, which put
          # startup past the liveness threshold and had the kubelet restarting
          # the container before it could finish. Allows up to 5 minutes.
          startupProbe:
            httpGet:
              # Prefixed: --static-prefix moves every route, /health included.
              path: /mlflow/health
              port: 5000
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /mlflow/health
              port: 5000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /mlflow/health
              port: 5000
            periodSeconds: 30
          volumeMounts:
            - name: store
              mountPath: /mlflow
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: mlflow
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlflow
spec:
  selector:
    app: mlflow
  ports:
    - name: http
      port: 80
      targetPort: 5000
