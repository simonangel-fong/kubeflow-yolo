# Namespace for the served model.
#
# Not kubeflow. KServe's pod-mutator webhook -- which injects the storage
# initializer and the queue proxy -- carries
#
#   namespaceSelector: control-plane DoesNotExist
#
# and kubeflow is labelled control-plane=kubeflow, so every predictor pod there
# is skipped by design: the label exists to stop KServe mutating Kubeflow's own
# control-plane pods. An InferenceService in kubeflow comes up with no init
# container and an empty /mnt/models.
#
# Left out of the ambient mesh as well. istio-install ships a global-deny-all
# AuthorizationPolicy, and enrolling this namespace would mean writing ALLOW
# policies for the predictor before anything could reach it.

apiVersion: v1
kind: Namespace
metadata:
  name: yolo-serving
  labels:
    # The predictor runs as an arbitrary non-root UID; nothing here needs more.
    pod-security.kubernetes.io/enforce: restricted
