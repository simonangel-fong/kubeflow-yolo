# YOLO car-plate predictor.
#
# A custom predictor rather than a stock ONNX/Triton runtime: the exported
# graph has no pre/post-processing, and supplying that to Triton means either
# a Python backend or an ensemble config -- both heavier than kind wants. The
# container in serve/ does the letterbox and NMS itself.
#
# STORAGE_URI points at the MLflow model version. The storage initializer pulls
# it to /mnt/models before the predictor container starts.

apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: yolo-car-plate
  namespace: kubeflow
  annotations:
    # kind has no load balancer and no autoscaler worth the trouble; keep one
    # pod up rather than paying a cold start on every demo request.
    serving.kserve.io/deploymentMode: RawDeployment
    autoscaling.knative.dev/min-scale: "1"
spec:
  predictor:
    # PSS restricted, as with the TrainJob.
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 100
      seccompProfile:
        type: RuntimeDefault

    containers:
      # KServe requires this exact name for the predictor container.
      - name: kserve-container
        image: simonangelfong/kubeflow-yolo-inference:v0.1.0-cpu
        imagePullPolicy: IfNotPresent

        env:
          - name: MODEL_NAME
            value: yolo-car-plate
          - name: MODEL_DIR
            value: /mnt/models
          - name: CONF_THRESHOLD
            value: "0.25"
          # Triggers the storage initializer. Set by kustomize per environment;
          # models:/ URIs need the MLflow tracking server reachable in-cluster.
          - name: STORAGE_URI
            value: "pvc://yolo-train/artifacts/model"

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]

        ports:
          - containerPort: 8080
            protocol: TCP

        readinessProbe:
          httpGet:
            path: /v1/models/yolo-car-plate
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 30

        resources:
          requests:
            cpu: "500m"
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
