# Allow the API server to reach the KServe admission webhook.
#
#   Synced by argocd/apps/12-kserve-policy.yaml
#
# istio-install ships a global-deny-all AuthorizationPolicy (istio-system,
# empty spec) enforced by ztunnel across the ambient mesh, and the kubeflow
# namespace carries istio.io/dataplane-mode: ambient. Under ambient, once any
# ALLOW policy exists everything else is denied, so inbound traffic to the
# kserve controller is dropped at L4 before it reaches the webhook server:
#
#   connection closed due to policy rejection: allow policies exist, but none allowed
#   dst.service="kserve-webhook-server-service.kubeflow.svc.cluster.local"
#
# The symptom is every ClusterServingRuntime and InferenceService failing to
# admit with "failed calling webhook ...: EOF" -- which reads like a TLS or
# certificate fault but is not: the certs are valid and the connection never
# reaches the controller.
#
# The paired NetworkPolicy already admits 9443 (kserve, from kubeflow-roles),
# so this is the only layer still closed.

apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: kserve-webhook-allow-apiserver
  namespace: kubeflow
spec:
  action: ALLOW
  # Scoped to the controller rather than the whole namespace: this opens an
  # admission webhook, and nothing else in kubeflow needs the exemption.
  selector:
    matchLabels:
      control-plane: kserve-controller-manager
  rules:
    # No source constraint. The API server is not ambient-enrolled, so its
    # traffic carries no mesh identity -- principals and namespaces both fail
    # to match. The port restriction and the selector are what scope this;
    # the NetworkPolicy is what restricts who can reach the pod at all.
    - to:
        - operation:
            ports:
              - "9443"
