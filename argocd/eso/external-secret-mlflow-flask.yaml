apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-flask-server-secret-key
  namespace: kubeflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    # Name must match what the chart's deployment references:
    # <fullname>-flask-server-secret-key
    name: mlflow-flask-server-secret-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MLFLOW_FLASK_SERVER_SECRET_KEY
      remoteRef:
        key: kubeflow-yolo-dev/mlflow-flask-key
        property: key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
