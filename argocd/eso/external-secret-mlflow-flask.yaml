apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-flask-server-secret-key
  namespace: kubeflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    # Deliberately NOT mlflow-flask-server-secret-key: the chart renders a
    # pre-install hook secret under that name and no chart value disables it,
    # so both apps would claim it (SharedResourceWarning). The chart appends
    # this secret after its own in envFrom, so this value wins.
    name: mlflow-flask-eso
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MLFLOW_FLASK_SERVER_SECRET_KEY
      remoteRef:
        key: kubeflow-yolo-dev/mlflow-flask-key
        property: key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
