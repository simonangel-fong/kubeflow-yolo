apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-postgres
  namespace: kubeflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: mlflow-postgres
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: kubeflow-yolo-dev/mlflow-postgres
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: kubeflow-yolo-dev/mlflow-postgres
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
