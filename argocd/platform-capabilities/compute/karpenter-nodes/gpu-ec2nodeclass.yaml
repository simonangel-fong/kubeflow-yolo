# Node Class for gpu workload.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  role: kubeflow-yolo-dev-karpenter-node
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: kubeflow-yolo
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: kubeflow-yolo
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeType: gp3
        volumeSize: 200Gi
        deleteOnTermination: true
        encrypted: true
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  tags:
    Name: kubeflow-yolo-dev-gpu
    workload-class: gpu
    Cluster: kubeflow-yolo-dev
    ManagedBy: karpenter
