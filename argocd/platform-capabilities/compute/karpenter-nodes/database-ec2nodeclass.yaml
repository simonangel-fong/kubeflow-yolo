# Node Class for database workload.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: database
spec:
  role: kubeflow-yolo-dev-karpenter-node
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: kubeflow-yolo-dev
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: kubeflow-yolo-dev
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeType: gp3
        volumeSize: 100Gi
        deleteOnTermination: true
        encrypted: true
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  tags:
    Name: kubeflow-yolo-dev-database
    workload-class: database
    Cluster: kubeflow-yolo-dev
    ManagedBy: karpenter
