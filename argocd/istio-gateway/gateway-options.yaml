# Patches the deployment istiod auto-provisions for the istio-ingress Gateway.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gw-options
  namespace: istio-ingress
data:
  deployment: |
    spec:
      template:
        metadata:
          labels:
            # kubeflow-gateway selects istio=ingressgateway
            istio: ingressgateway
        spec:
          nodeSelector:
            workload-class: platform
          tolerations:
            - key: workload-class
              operator: Equal
              value: platform
              effect: NoSchedule
