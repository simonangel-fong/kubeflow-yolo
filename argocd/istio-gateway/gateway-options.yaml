# strategic merge patch applied to the deployment istiod auto-provisions
# for the istio-ingress Gateway; referenced via spec.infrastructure.parametersRef
apiVersion: v1
kind: ConfigMap
metadata:
  name: gw-options
  namespace: istio-ingress
data:
  deployment: |
    spec:
      template:
        metadata:
          labels:
            # kubeflow-gateway (networking.istio.io) selects istio=ingressgateway;
            # Gateway API pods don't carry it by default, so the kubeflow
            # VirtualServices would bind to a gateway with no workload.
            istio: ingressgateway
        spec:
          nodeSelector:
            workload-class: platform
          tolerations:
            - key: workload-class
              operator: Equal
              value: platform
              effect: NoSchedule
