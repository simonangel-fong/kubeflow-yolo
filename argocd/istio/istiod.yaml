# istiod - control plane
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-istiod
  namespace: argocd
  labels:
    scope: platform
    capability: network
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.30.3
    helm:
      releaseName: istiod
      values: |
        pilot:
          # required with istio-cni: stop injecting the privileged istio-init
          cni:
            enabled: true
          nodeSelector:
            workload-class: platform
          tolerations:
            - key: workload-class
              operator: Equal
              value: platform
              effect: NoSchedule
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
          autoscaleMin: 2
          autoscaleMax: 5
        global:
          proxy:
            # injected containers must set this for namespaces enforcing
            # PodSecurity "restricted" (kubeflow)
            seccompProfile:
              type: RuntimeDefault
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: "2"
                memory: 1Gi
        meshConfig:
          accessLogFile: /dev/stdout
          # oauth2-proxy external authz for kubeflow. Upstream ships this as a
          # patch to the istio ConfigMap; that patch is excluded here because
          # istiod is installed from this chart, so define the provider inline.
          extensionProviders:
            - name: oauth2-proxy
              envoyExtAuthzHttp:
                service: oauth2-proxy.oauth2-proxy.svc.cluster.local
                port: 80
                headersToDownstreamOnDeny:
                  - content-type
                  - set-cookie
                headersToUpstreamOnAllow:
                  - authorization
                  - path
                  - x-auth-request-email
                  - x-auth-request-groups
                  - x-auth-request-user
                includeRequestHeadersInCheck:
                  - authorization
                  - cookie
          defaultConfig:
            holdApplicationUntilProxyStarts: true
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: istio-sidecar-injector
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
        - .webhooks[].failurePolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istio-validator-istio-system
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
        - .webhooks[].failurePolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
