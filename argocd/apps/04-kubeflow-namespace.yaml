# kubeflow namespace
#
# Ahead of istio-install: the ambient overlay patches this namespace with
# istio.io/dataplane-mode=ambient, so it must already exist.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-namespace
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/kubeflow/manifests.git
    targetRevision: "26.03.1"
    path: common/kubeflow-namespace/base

  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
