# istiod + istio-cni + ztunnel, ambient mode
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-install
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/kubeflow/manifests.git
    targetRevision: "26.03.1"
    path: common/istio/istio-install/overlays/ambient
    kustomize:
      # The ambient component redefines Namespace/istio-system only to set the
      # PSS-privileged label. istio-namespace (wave 3) owns that object and
      # carries the label itself, so drop this copy to keep a single owner.
      patches:
        - target:
            kind: Namespace
            name: istio-system
          patch: |-
            $patch: delete
            apiVersion: v1
            kind: Namespace
            metadata:
              name: istio-system

        # kind has no load balancer, so the gateway Service ships as ClusterIP
        # and nothing ever binds a node port -- kind/cluster.yaml maps host
        # 8080 to node 80, but node 80 has no listener and the mapping is dead.
        #
        # NodePort fixes that. The ports are 30080/30443 rather than 80/443:
        # this cluster runs the default --service-node-port-range of
        # 30000-32767, and a nodePort outside it is rejected outright.
        # kind/cluster.yaml maps them to host 8080/8443 to match.
        #
        # ports[1] is http2 (80 -> 8080) and ports[2] is https (443 -> 8443);
        # the indices are positional, so a change to the upstream Service's
        # port order would need this patch revisited.
        - target:
            kind: Service
            name: istio-ingressgateway
          patch: |-
            - op: replace
              path: /spec/type
              value: NodePort
            - op: add
              path: /spec/ports/1/nodePort
              value: 30080
            - op: add
              path: /spec/ports/2/nodePort
              value: 30443

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  # istiod flips this webhook's failurePolicy from Ignore to Fail once it is
  # healthy. Without this, selfHeal reverts it on every sync, forever.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istio-validator-istio-system
      jsonPointers:
        - /webhooks/0/failurePolicy

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2


