# istiod + istio-cni + ztunnel, ambient mode
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-install
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/kubeflow/manifests.git
    targetRevision: "26.03.1"
    path: common/istio/istio-install/overlays/ambient
    kustomize:
      # The ambient component redefines Namespace/istio-system only to set the
      # PSS-privileged label. istio-namespace (wave 3) owns that object and
      # carries the label itself, so drop this copy to keep a single owner.
      patches:
        - target:
            kind: Namespace
            name: istio-system
          patch: |-
            $patch: delete
            apiVersion: v1
            kind: Namespace
            metadata:
              name: istio-system

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  # istiod flips this webhook's failurePolicy from Ignore to Fail once it is
  # healthy. Without this, selfHeal reverts it on every sync, forever.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istio-validator-istio-system
      jsonPointers:
        - /webhooks/0/failurePolicy

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2


