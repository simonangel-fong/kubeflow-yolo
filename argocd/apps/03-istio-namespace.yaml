# istio-system namespace + baseline network policies

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-namespace
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/kubeflow/manifests.git
    targetRevision: "26.03.1"
    path: common/istio/istio-namespace/base
    kustomize:
      # ztunnel needs CAP_SYS_ADMIN/NET_ADMIN/NET_RAW, so this namespace must
      # be PSS-privileged. Upstream sets it to restricted; the ambient overlay
      # in istio-install normally overrides it, but that copy is dropped there
      # so this app is the only owner of the Namespace object.
      patches:
        - target:
            kind: Namespace
            name: istio-system
          patch: |-
            - op: replace
              path: /metadata/labels/pod-security.kubernetes.io~1enforce
              value: privileged

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
