# istio-system namespace + baseline network policies

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-namespace
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/kubeflow/manifests.git
    targetRevision: "26.03.1"
    path: common/istio/istio-namespace/base

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  # The ambient overlay in istio-install labels this namespace PSS-privileged
  # for ztunnel. This app owns the Namespace but does not declare that label.
  ignoreDifferences:
    - group: ""
      kind: Namespace
      name: istio-system
      jsonPointers:
        - /metadata/labels/pod-security.kubernetes.io~1enforce

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
