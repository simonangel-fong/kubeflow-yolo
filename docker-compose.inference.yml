# Local test of the predictor image, with a browser UI in front of it.
#   docker compose -f docker-compose.inference.yml up --build
#   curl localhost:8080/v1/models/kubeflow-yolo-plate     API directly
#   http://localhost:3000                            UI

services:
  inference:
    build:
      context: .
      dockerfile: inference/Dockerfile
    image: kubeflow-yolo-kserve:v0.1.0-cpu

    environment:
      MODEL_NAME: kubeflow-yolo-plate
      MODEL_DIR: /mnt/models
      CONF_THRESHOLD: "0.25"
      IOU_THRESHOLD: "0.45"

    volumes:
      # read-only, as the cluster mounts it
      - ./models:/mnt/models:ro

    # 8081, not 8080: kind publishes the cluster's ingress on host 8080.
    ports:
      - "127.0.0.1:8081:8080"

    # mirrors the InferenceService probes, so a broken model fails here first
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/v1/models/kubeflow-yolo-plate').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: simonangelfong/kubeflow-yolo-ui:v0.1.0

    ports:
      - "127.0.0.1:3000:8080"

    # nginx proxies /v1/ to inference:8080; wait for the model to be loaded so
    # the UI's first readiness call does not race the predictor's startup.
    depends_on:
      inference:
        condition: service_healthy
