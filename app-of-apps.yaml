apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 00-app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background # Deleting the root cascades to the children
spec:
  project: default

  source:
    repoURL: https://github.com/simonangel-fong/kubeflow-yolo.git
    targetRevision: master
    path: argocd
    directory:
      recurse: true
      # Only the Application files, which sit directly under argocd/<capability>/.
      # Without the depth limit this also applies the manifests inside
      # karpenter-nodes/ and storage-classes/, so the root and its children both
      # own the same objects — and the root then fails on immutable fields like
      # StorageClass.parameters.
      include: "*/*.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd 

  syncPolicy:
    automated:
      prune: true # Remove child Applications deleted from git.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true # Skip re-applying unchanged children on every sync.
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2

  # Tolerate the replica drift ArgoCD would otherwise report as OutOfSync.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
