apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 00-app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background # Deleting the root cascades to the children
spec:
  project: default

  source:
    repoURL: https://github.com/simonangel-fong/kubeflow-yolo.git
    targetRevision: master
    path: argocd
    directory:
      recurse: true
      include: "*.yaml" # Ignore README/docs dropped alongside the manifests.
      # The child Applications own what lives in these directories. Without the
      # exclude, recursion applies those manifests here too, so the root and its
      # children both own the same objects — and the root then fails outright on
      # immutable fields like StorageClass.parameters.
      # NOTE: include matches filenames only; directory scoping needs exclude.
      exclude: "{compute/karpenter-nodes/*,storage/storage-classes/*}"

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd 

  syncPolicy:
    automated:
      prune: true # Remove child Applications deleted from git.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true # Skip re-applying unchanged children on every sync.
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2

  # Tolerate the replica drift ArgoCD would otherwise report as OutOfSync.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
