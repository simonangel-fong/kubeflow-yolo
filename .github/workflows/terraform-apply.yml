name: Terraform apply

on:
  pull_request:
    paths:
      - "infra/**"
      - "web/**"
      - ".github/workflows/terraform-apply.yml"
  push:
    branches: [master]
    paths:
      - "infra/**"
      - "web/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: plan
        type: choice
        options: [plan, apply]
      root:
        description: "Root module to target"
        required: true
        default: cluster
        type: choice
        options: [project, cluster, both]

permissions:
  contents: read
  id-token: write # required for oidc

concurrency:
  group: terraform-apply-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_BACKEND_BUCKET: simonangelfong-terraform-backend

jobs:
  # ##############################
  # plan: read-only, runs on PRs and pushes
  # ##############################
  # ##############################
  # website: fail a PR whose landing page references a file that is not there
  # ##############################
  verify-web:
    name: Verify website assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check referenced assets exist
        working-directory: web
        run: |
          set -euo pipefail

          missing=0
          for f in index.html assets/css/style.css assets/js/main.js; do
            if [ ! -f "$f" ]; then
              echo "::error::missing from web/: $f"
              missing=1
            fi
          done

          # Every local asset index.html points at must be present.
          while read -r ref; do
            if [ ! -f "$ref" ]; then
              echo "::error::index.html references missing file: $ref"
              missing=1
            fi
          done < <(grep -oE '(src|href)="(img|assets)/[^"]*"' index.html | sed 's/.*="//;s/"//' | sort -u)

          # The hero background is reached from CSS, not the HTML.
          while read -r ref; do
            if [ ! -f "$ref" ]; then
              echo "::error::style.css references missing file: $ref"
              missing=1
            fi
          done < <(grep -oE 'url\("\.\./\.\./[^"]*"\)' assets/css/style.css | sed 's|.*\.\./\.\./||;s|")||' | sort -u)

          exit "$missing"

  terraform-plan:
    name: Plan (${{ matrix.root }})
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: tf-apply
    permissions:
      contents: read
      id-token: write
      pull-requests: write # to post the plan comment
    strategy:
      fail-fast: false
      matrix:
        root: [project, cluster]
    defaults:
      run:
        working-directory: infra/${{ matrix.root }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=kubeflow-yolo/${TF_ENV}/${{ matrix.root }}.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_ENV: ${{ vars.ENV || 'dev' }}

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        continue-on-error: true # Continues on failure
        run: terraform plan -no-color -input=false -lock-timeout=5m -out=tfplan
        env:
          TF_VAR_env: ${{ vars.ENV || 'dev' }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_eso_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_project_state_bucket: simonangelfong-terraform-backend
          TF_VAR_project_state_key: kubeflow-yolo/${{ vars.ENV || 'dev' }}/project.tfstate
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: Render plan
        id: render
        run: |
          set -euo pipefail

          if [ -f tfplan ]; then
            terraform show -no-color tfplan > plan.txt
          else
            echo "terraform plan failed; see the job log." > plan.txt
          fi

          # Keep the comment under the 65536-char API limit.
          if [ "$(wc -c < plan.txt)" -gt 60000 ]; then
            head -c 60000 plan.txt > plan.trunc
            printf '\n\n...truncated, see the job log for the full plan.\n' >> plan.trunc
            mv plan.trunc plan.txt
          fi

      - name: Comment plan on PR
        # if pr
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          ROOT: ${{ matrix.root }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const root = process.env.ROOT;
            const outcome = process.env.OUTCOME;
            const plan = fs.readFileSync(`infra/${root}/plan.txt`, 'utf8');
            // One marker per root so the two matrix jobs keep separate comments.
            const marker = `<!-- terraform-plan-${root} -->`;
            const fence = '```';
            const body = [
              marker,
              `### Terraform plan \`${root}\` - \`${outcome}\``,
              '',
              '<details><summary>Show plan</summary>',
              '',
              fence + 'terraform',
              plan,
              fence,
              '',
              '</details>',
            ].join('\n');

            // Update the existing comment rather than stacking one per push.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ##############################
  # apply: manual dispatch only, gated by the tf-apply environment
  # ##############################
  # project runs first: cluster reads its outputs via terraform_remote_state.
  terraform-apply-project:
    name: Apply (project)
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
      && (inputs.root == 'project' || inputs.root == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: tf-apply
    defaults:
      run:
        working-directory: infra/project
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=kubeflow-yolo/${TF_ENV}/project.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_ENV: ${{ vars.ENV || 'dev' }}

      - name: Apply
        run: terraform apply -auto-approve -input=false -lock-timeout=5m
        env:
          TF_VAR_env: ${{ vars.ENV || 'dev' }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      # Uploading a new object does not evict what CloudFront already cached,
      # so the site would keep serving the old files without this.
      - name: Invalidate CloudFront
        run: |
          set -euo pipefail

          dist=$(terraform output -raw web_cloudfront_distribution_id)
          id=$(aws cloudfront create-invalidation --distribution-id "$dist" --paths '/*' --query 'Invalidation.Id' --output text)

          echo "invalidation $id on $dist"
          aws cloudfront wait invalidation-completed --distribution-id "$dist" --id "$id"

      - name: Summary
        run: |
          {
            echo "### Terraform apply complete - project"
            echo
            terraform output -json | jq -r 'to_entries[] | "- **\(.key)**: \(.value.value|tostring)"' 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-apply-cluster:
    name: Apply (cluster)
    # always() keeps this running when root == 'cluster' and the project job is
    # skipped; the needs edge only enforces ordering when root == 'both'.
    if: >-
      always()
      && github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
      && (inputs.root == 'cluster' || inputs.root == 'both')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    needs: [terraform-apply-project]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: tf-apply
    defaults:
      run:
        working-directory: infra/cluster
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=kubeflow-yolo/${TF_ENV}/cluster.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_ENV: ${{ vars.ENV || 'dev' }}

      - name: Apply
        run: terraform apply -auto-approve -input=false -lock-timeout=5m
        env:
          TF_VAR_env: ${{ vars.ENV || 'dev' }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_eso_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_project_state_bucket: simonangelfong-terraform-backend
          TF_VAR_project_state_key: kubeflow-yolo/${{ vars.ENV || 'dev' }}/project.tfstate

      - name: Summary
        run: |
          {
            echo "### Terraform apply complete - cluster"
            echo
            terraform output -json | jq -r 'to_entries[] | "- **\(.key)**: \(.value.value|tostring)"' 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
