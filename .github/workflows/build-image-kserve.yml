name: Build kserve predictor image

on:
  push:
    branches: [master]
    paths:
      - "inference/**"
      - ".github/workflows/build-image-kserve.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to publish (default: v<run_number>-<short-sha>-cpu)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write # OIDC needs

concurrency:
  group: build-image-kserve-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-image-kserve:
    name: Build and push kserve image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short=7 HEAD)"
          tag="${INPUT_TAG:-v${GITHUB_RUN_NUMBER}-${short_sha}-cpu}"

          if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9._-]{1,128}$'; then
            echo "::error::invalid image tag: $tag"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: inference/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.ECR_REPO_KSERVE }}:${{ steps.meta.outputs.tag }}
            ${{ vars.ECR_REPO_KSERVE }}:sha-${{ steps.meta.outputs.short_sha }}-cpu
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        env:
          IMAGE: ${{ vars.ECR_REPO_KSERVE }}:${{ steps.meta.outputs.tag }}
        run: |
          {
            echo "### KServe predictor image pushed"
            echo
            echo '```'
            echo "$IMAGE"
            echo '```'
            echo
            echo "Pin this tag in the InferenceService, then re-apply it."
          } >> "$GITHUB_STEP_SUMMARY"
