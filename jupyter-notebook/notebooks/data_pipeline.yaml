# PIPELINE DEFINITION
# Name: yolo-data
# Inputs:
#    bucket: str [Default: 'kubeflow-yolo-dev-099139718958']
#    dvc_dir_hash: str [Default: '0e94102a7a6b4424a0f1292c2f221072.dir']
#    region: str [Default: 'ca-central-1']
#    split_seed: int [Default: 0.0]
#    val_fraction: float [Default: 0.2]
components:
  comp-fetch-data:
    executorLabel: exec-fetch-data
    inputDefinitions:
      parameters:
        bucket:
          parameterType: STRING
        dvc_dir_hash:
          parameterType: STRING
        region:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        raw:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-prepare-data:
    executorLabel: exec-prepare-data
    inputDefinitions:
      artifacts:
        raw:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        split_seed:
          parameterType: NUMBER_INTEGER
        val_fraction:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        processed:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-fetch-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - fetch_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'boto3'  && \
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef fetch_data(\n    bucket: str,\n    dvc_dir_hash: str,\n    region:\
          \ str,\n    raw: Output[Dataset],\n):\n    \"\"\"Restore the DVC-tracked\
          \ raw dataset from S3 into the `raw` artifact.\"\"\"\n    import json\n\
          \    from concurrent.futures import ThreadPoolExecutor\n    from pathlib\
          \ import Path\n\n    import boto3\n\n    s3 = boto3.client(\"s3\", region_name=region)\n\
          \n    def dvc_key(md5: str) -> str:\n        # DVC shards its content-addressed\
          \ store by the first two hex chars.\n        return \"dvcstore/files/md5/\"\
          \ + md5[:2] + \"/\" + md5[2:]\n\n    # the .dir object lists {\"md5\": ...,\
          \ \"relpath\": ...} for every file\n    manifest = json.loads(\n       \
          \ s3.get_object(Bucket=bucket, Key=dvc_key(dvc_dir_hash))[\"Body\"].read()\n\
          \    )\n\n    root = Path(raw.path)\n    root.mkdir(parents=True, exist_ok=True)\n\
          \n    def fetch(entry):\n        target = root / entry[\"relpath\"]\n  \
          \      target.parent.mkdir(parents=True, exist_ok=True)\n        s3.download_file(bucket,\
          \ dvc_key(entry[\"md5\"]), str(target))\n\n    # 1100+ small objects: this\
          \ is latency-bound, not bandwidth-bound\n    with ThreadPoolExecutor(max_workers=16)\
          \ as pool:\n        list(pool.map(fetch, manifest))\n\n    images = [p for\
          \ p in root.iterdir() if p.suffix.lower() in {\".jpeg\", \".jpg\", \".png\"\
          }]\n    if not images:\n        raise RuntimeError(\"no images restored\
          \ -- check the dvc_dir_hash\")\n\n    # metadata shows up on the artifact\
          \ in the run UI\n    raw.metadata[\"files\"] = len(manifest)\n    raw.metadata[\"\
          images\"] = len(images)\n    raw.metadata[\"dvc_dir_hash\"] = dvc_dir_hash\n\
          \n    print(\"fetched\", len(manifest), \"files /\", len(images), \"images\
          \ to\", root)\n\n"
        image: python:3.12
    exec-prepare-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - prepare_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pyyaml'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef prepare_data(\n    raw: Input[Dataset],\n    val_fraction: float,\n\
          \    split_seed: int,\n    processed: Output[Dataset],\n):\n    \"\"\"Build\
          \ processed/{train,val}/{images,labels} plus data.yaml.\"\"\"\n    import\
          \ random\n    import shutil\n    from pathlib import Path\n\n    import\
          \ yaml\n\n    suffixes = {\".jpeg\", \".jpg\", \".png\"}\n    src = Path(raw.path)\n\
          \    dst = Path(processed.path)\n\n    # images and labels pair by basename:\
          \ foo.jpeg <-> foo.txt\n    stems = sorted(p.stem for p in src.iterdir()\
          \ if p.suffix.lower() in suffixes)\n    random.Random(split_seed).shuffle(stems)\n\
          \    cut = int(len(stems) * (1 - val_fraction))\n\n    counts = {}\n   \
          \ for split, names in ((\"train\", stems[:cut]), (\"val\", stems[cut:])):\n\
          \        for sub in (\"images\", \"labels\"):\n            (dst / split\
          \ / sub).mkdir(parents=True, exist_ok=True)\n        for stem in names:\n\
          \            image = next(p for p in src.glob(stem + \".*\") if p.suffix.lower()\
          \ in suffixes)\n            shutil.copy(image, dst / split / \"images\"\
          \ / image.name)\n            label = src / (stem + \".txt\")\n         \
          \   # an image with no label file is a legitimate negative sample\n    \
          \        if label.exists():\n                shutil.copy(label, dst / split\
          \ / \"labels\" / label.name)\n        counts[split] = len(names)\n\n   \
          \ if not counts[\"train\"] or not counts[\"val\"]:\n        raise RuntimeError(\"\
          empty split: \" + str(counts))\n\n    class_names = (src / \"classes.txt\"\
          ).read_text().split()\n    (dst / \"data.yaml\").write_text(\n        yaml.safe_dump(\n\
          \            {\n                \"path\": str(dst),          # absolute,\
          \ see above\n                \"train\": \"train/images\",\n            \
          \    \"val\": \"val/images\",\n                \"nc\": len(class_names),\n\
          \                \"names\": class_names,\n            },\n            sort_keys=False,\n\
          \        )\n    )\n\n    processed.metadata.update(counts)\n    processed.metadata[\"\
          classes\"] = class_names\n    print(\"split\", counts, \"classes\", class_names)\n\
          \    print((dst / \"data.yaml\").read_text())\n\n"
        image: python:3.12
pipelineInfo:
  name: yolo-data
root:
  dag:
    tasks:
      fetch-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-fetch-data
        inputs:
          parameters:
            bucket:
              componentInputParameter: bucket
            dvc_dir_hash:
              componentInputParameter: dvc_dir_hash
            region:
              componentInputParameter: region
        taskInfo:
          name: fetch-data
      prepare-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-prepare-data
        dependentTasks:
        - fetch-data
        inputs:
          artifacts:
            raw:
              taskOutputArtifact:
                outputArtifactKey: raw
                producerTask: fetch-data
          parameters:
            split_seed:
              componentInputParameter: split_seed
            val_fraction:
              componentInputParameter: val_fraction
        taskInfo:
          name: prepare-data
  inputDefinitions:
    parameters:
      bucket:
        defaultValue: kubeflow-yolo-dev-099139718958
        isOptional: true
        parameterType: STRING
      dvc_dir_hash:
        defaultValue: 0e94102a7a6b4424a0f1292c2f221072.dir
        isOptional: true
        parameterType: STRING
      region:
        defaultValue: ca-central-1
        isOptional: true
        parameterType: STRING
      split_seed:
        defaultValue: 0.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      val_fraction:
        defaultValue: 0.2
        isOptional: true
        parameterType: NUMBER_DOUBLE
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
