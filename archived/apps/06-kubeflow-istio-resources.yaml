# kubeflow-gateway + istio cluster roles
#
# The notebook controller creates one VirtualService per notebook, each bound
# to kubeflow-gateway. Without this the notebook UI is unreachable.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-istio-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/kubeflow/manifests.git
    targetRevision: "26.03.1"
    path: common/istio/kubeflow-istio-resources/base

  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow

  # Aggregated ClusterRoles ship with empty rules; the RBAC controller fills
  # them in from the roles matching their aggregationRule.
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      jsonPointers:
        - /rules

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
