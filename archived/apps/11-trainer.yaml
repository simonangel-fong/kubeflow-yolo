# kubeflow trainer v2 -- TrainJob controller, JobSet, and the runtime catalog

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trainer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/kubeflow/trainer.git
    targetRevision: "v2.3.0"
    path: manifests/overlays/kubeflow-platform

  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow

  ignoreDifferences:
    - group: ""
      kind: Secret
      name: kubeflow-trainer-webhook-cert
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: jobset-webhook-server-cert
      jsonPointers:
        - /data
    # caBundle is injected at runtime from those same self-signed certs.
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    # Aggregated ClusterRole: rules are filled in by the RBAC controller.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kubeflow-trainer-admin
      jsonPointers:
        - /rules

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The four trainer/jobset CRDs are far past the annotation size limit
      # that client-side apply would impose.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
