# MLflow tracking server.
#
# Wave 15: after istio (5) and kubeflow-istio-resources (6), whose
# kubeflow-gateway the VirtualService binds to. Nothing else depends on it --
# the notebook logs to it over plain HTTP by Service DNS.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/simonangel-fong/kubeflow-yolo.git
    targetRevision: master
    path: argocd/manifests/mlflow

  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
