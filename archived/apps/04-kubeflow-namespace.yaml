# kubeflow + kubeflow-system namespaces
#
# Ahead of istio-install: the ambient overlay expects these to already exist.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-namespace
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/kubeflow/manifests.git
    targetRevision: "26.03.1"
    path: common/kubeflow-namespace/base
    kustomize:
      # Upstream labels these for sidecar injection. This cluster runs ambient,
      # where enrollment is by dataplane-mode and no sidecar is injected.
      patches:
        - target:
            kind: Namespace
            name: kubeflow(-system)?
          patch: |-
            - op: remove
              path: /metadata/labels/istio-injection
            - op: add
              path: /metadata/labels/istio.io~1dataplane-mode
              value: ambient

  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
