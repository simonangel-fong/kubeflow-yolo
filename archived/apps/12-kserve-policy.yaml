# Istio authorization for the KServe admission webhook.
#
# Wave 12, ahead of kserve (13): the ClusterServingRuntimes in that app are
# validated by the webhook as they apply, so the mesh has to admit the API
# server's call first. Sync them the other way round and every runtime fails
# with "failed calling webhook ...: EOF".
#
# This app only carries the AuthorizationPolicy; the matching NetworkPolicy
# ships with kubeflow-roles (wave 6) and is already in place.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve-policy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/simonangel-fong/kubeflow-yolo.git
    targetRevision: master
    path: argocd/manifests/kserve-policy

  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
