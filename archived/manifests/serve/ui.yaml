# Browser UI for the predictor: pick an image, POST it, draw the boxes.
#
# A plain Deployment rather than a second InferenceService -- it serves static
# files and proxies, and has no model to load.
#
# nginx proxies /v1/ to the predictor Service so the browser sees one origin.
# Both live in yolo-serving, which is outside the ambient mesh, so the
# global-deny-all AuthorizationPolicy in istio-system does not apply to this
# hop and no ALLOW policy is needed.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: yolo-ui
  namespace: yolo-serving
  labels:
    app: yolo-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yolo-ui
  template:
    metadata:
      labels:
        app: yolo-ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx user in the alpine image
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: nginx
          image: simonangelfong/kubeflow-yolo-ui:v0.1.1
          imagePullPolicy: IfNotPresent

          env:
            # KServe's predictor Service listens on 80 and forwards to 8080.
            - name: PREDICTOR_UPSTREAM
              value: yolo-car-plate-predictor.yolo-serving.svc.cluster.local:80

          ports:
            - containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          # nginx as non-root needs these writable: conf.d receives the
          # rendered template at start-up, and the cache/run dirs are created
          # by the master process before it drops to a worker.
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run

          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10

          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: 256Mi

      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: yolo-ui
  namespace: yolo-serving
spec:
  selector:
    app: yolo-ui
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
