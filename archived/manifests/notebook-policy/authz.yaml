# Allow the ingress gateway to reach notebook pods.
#
#   Synced by argocd/apps/09-notebook-policy.yaml
#
# istio-install ships a global-deny-all AuthorizationPolicy enforced by
# ztunnel across the ambient mesh. Upstream Kubeflow pairs it with per-app
# ALLOW policies; only the notebook one is needed here.
#
# Second of two layers -- netpol.yaml alongside opens the NetworkPolicy first.
# Without that one the packet is dropped in the CNI and never reaches ztunnel,
# so this policy alone changes nothing.

apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: notebooks-allow-ingressgateway
  namespace: kubeflow
spec:
  action: ALLOW
  # No selector: Istio selectors are matchLabels-only and cannot express
  # "any pod with a notebook-name label". This applies to the whole kubeflow
  # namespace, which is what the paired NetworkPolicy already scopes.
  # No source constraint. The gateway is not ambient-enrolled, so its traffic
  # carries no mesh identity and neither principals nor namespaces will match
  # -- both were tried and ztunnel rejected them. Access is restricted by
  # kind/notebook-netpol.yaml instead, which admits only istio-system.
  rules:
    - {}
