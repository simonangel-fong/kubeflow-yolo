server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Base64 inflates an image by ~33%, so the JSON body is larger than the
    # file the user picked. The predictor caps decoded bytes at 10 MB.
    client_max_body_size 16m;

    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy the API so the browser sees one origin and CORS never applies.
    # "inference" is the compose service name, resolved on the shared network.
    location /v1/ {
        proxy_pass http://inference:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # A cold CPU inference on a large image takes a few hundred ms; the
        # default 60s is ample, but be explicit rather than inherit it.
        proxy_read_timeout 120s;
    }
}
