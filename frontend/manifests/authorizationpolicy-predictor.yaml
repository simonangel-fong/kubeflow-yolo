# The Profile's ns-owner-access-istio policy has an empty selector, so it applies
# to every pod in the namespace -- the predictor included. Its rules only admit
# traffic carrying a kubeflow-userid header from the legacy istio-system gateway,
# or originating in-namespace. Requests from the UI reach the predictor via the
# Knative activator (knative-serving/sa/activator), which matches neither, so the
# inbound sidecar denies with rbac_access_denied_matched_policy[none].
#
# Istio ORs ALLOW policies, so this grants the activator access to the predictor
# without touching the Profile's policy (which is owner-referenced and would be
# reverted by the Profile controller anyway).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: kubeflow-yolo-plate-predictor-from-activator
  namespace: kubeflow-yolo
  labels:
    app: kubeflow-yolo-ui
spec:
  action: ALLOW
  selector:
    matchLabels:
      component: predictor
  rules:
    - from:
        - source:
            principals:
              # Knative routes through the activator when scaling from/near zero
              - cluster.local/ns/knative-serving/sa/activator
              # ...and direct pod-to-pod once the revision is scaled up
              - cluster.local/ns/kubeflow-yolo/sa/default-editor
