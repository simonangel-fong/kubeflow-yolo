# Kubeflow Central Dashboard + auth, from kubeflow/community-distribution 26.03.1.
#
# Deliberately EXCLUDES common/cert-manager and common/istio/* (istio-crds,
# istio-namespace, istio-install): this cluster installs both from argocd/init,
# and pulling them here would duplicate the control plane.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # oauth2-proxy: m2m-dex-and-eks so k8s service-account JWTs are accepted
  - https://github.com/kubeflow/community-distribution//common/oauth2-proxy/overlays/m2m-dex-and-eks?ref=26.03.1
  # Dex: identity provider behind oauth2-proxy
  - https://github.com/kubeflow/community-distribution//common/dex/overlays/oauth2-proxy?ref=26.03.1
  # kubeflow namespace + cluster roles
  - https://github.com/kubeflow/community-distribution//common/kubeflow-namespace/base?ref=26.03.1
  - https://github.com/kubeflow/community-distribution//common/kubeflow-roles/base?ref=26.03.1
  # kubeflow-gateway (networking.istio.io) + auth policies
  - https://github.com/kubeflow/community-distribution//common/istio/kubeflow-istio-resources/base?ref=26.03.1
  # central dashboard
  - https://github.com/kubeflow/community-distribution//applications/dashboard/overlays/istio?ref=26.03.1
  # default user profile namespace
  - https://github.com/kubeflow/community-distribution//common/user-namespace/base?ref=26.03.1

patches:
  # The m2m-dex-and-eks overlay ships a placeholder issuer; substitute this
  # cluster's OIDC issuer (aws eks describe-cluster ... identity.oidc.issuer).
  - patch: |-
      - op: replace
        path: /spec/jwtRules/0/issuer
        value: https://oidc.eks.ca-central-1.amazonaws.com/id/AC93E97B9D09852BC7D9FDDCAF5D12AF
    target:
      group: security.istio.io
      kind: RequestAuthentication
      name: m2m-token-issuer
      namespace: istio-system
