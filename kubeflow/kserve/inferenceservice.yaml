apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: kubeflow-yolo-plate
  namespace: kubeflow-yolo
  annotations:
    autoscaling.knative.dev/min-scale: "1"
    # Takes the Knative activator off the request path, so callers connect to the
    # predictor directly over mTLS and AuthorizationPolicy can match the source
    # namespace. With the activator relaying, requests arrive from 127.0.0.6 with
    # no identity and every policy fails with matched_policy[none]. Safe here:
    # min-scale 1 means this never scales to zero, so the activator buys nothing.
    # https://kserve.github.io/website/docs/admin-guide/serverless/servicemesh
    autoscaling.knative.dev/targetBurstCapacity: "0"
    autoscaling.knative.dev/max-scale: "3"
    autoscaling.knative.dev/metric: "concurrency"
    autoscaling.knative.dev/target: "2"
spec:
  predictor:
    serviceAccountName: default-editor

    containers:
      - name: kserve-container
        image: 099139718958.dkr.ecr.ca-central-1.amazonaws.com/kubeflow-yolo-kserve:v3-737e1b5-cpu
        imagePullPolicy: IfNotPresent

        env:
          - name: MODEL_NAME
            value: kubeflow-yolo-plate
          - name: MODEL_DIR
            value: /mnt/models
          - name: STORAGE_URI
            value: s3://kubeflow-yolo-dev-099139718958/pipeline/runs/1647e571-4cb8-414b-8340-24a72d4b82dc/serve
          - name: CONF_THRESHOLD
            value: "0.25"
          - name: IOU_THRESHOLD
            value: "0.45"
          - name: AWS_REGION
            value: ca-central-1

        ports:
          - containerPort: 8080
            protocol: TCP

        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20

        # the model route, not /healthz: no traffic until the ONNX session loads
        readinessProbe:
          httpGet:
            path: /v1/models/kubeflow-yolo-plate
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 30
