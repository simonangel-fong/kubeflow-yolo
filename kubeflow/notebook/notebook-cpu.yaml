---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yolo-cpu-workspace
  namespace: kubeflow-user-example-com
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 20Gi
---
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: yolo-cpu
  namespace: kubeflow-user-example-com
  labels:
    app: yolo-cpu
    # Opts the pod into the kfp-api-token PodDefault, which mounts the token
    # kfp.Client() needs to submit pipelines. It belongs here rather than under
    # spec.template: the Notebook CRD's template accepts only `spec`, and the
    # controller copies these labels onto the pod it creates.
    kfp-api-token: "true"
spec:
  template:
    spec:
      nodeSelector:
        workload-class: general
      serviceAccountName: default-editor

      containers:
        - name: notebook
          image: ghcr.io/kubeflow/kubeflow/notebook-servers/jupyter-scipy:v1.11.0
          imagePullPolicy: IfNotPresent

          env:
            - name: YOLO_CONFIG_DIR
              value: /home/jovyan/.ultralytics
            - name: AWS_REGION
              value: ca-central-1

          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 8Gi

          volumeMounts:
            - name: workspace
              mountPath: /home/jovyan

      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: yolo-cpu-workspace
