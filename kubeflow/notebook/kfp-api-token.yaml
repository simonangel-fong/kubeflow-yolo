# Mounts a ServiceAccount token the notebook can present to the Kubeflow
# Pipelines API. Without it kfp.Client() has no credentials: the notebook's
# default token has the wrong audience, and the request is rejected.
#
# Applies to any pod in the namespace labelled `kfp-api-token: "true"`.
apiVersion: kubeflow.org/v1alpha1
kind: PodDefault
metadata:
  name: kfp-api-token
  namespace: kubeflow-user-example-com
spec:
  desc: "Allow access to the Kubeflow Pipelines API"
  selector:
    matchLabels:
      kfp-api-token: "true"
  env:
    - name: KF_PIPELINES_SA_TOKEN_PATH
      value: /var/run/secrets/kubeflow/pipelines/token
  volumes:
    - name: volume-kf-pipeline-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 7200
              # The API validates this audience; a default token carries the
              # cluster audience instead and is refused.
              audience: pipelines.kubeflow.org
  volumeMounts:
    - name: volume-kf-pipeline-token
      mountPath: /var/run/secrets/kubeflow/pipelines
      readOnly: true
