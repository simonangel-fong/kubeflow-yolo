# Allow notebook pods to reach the KFP API.
#
# The stock ml-pipeline-ui policy authorizes token-bearing calls via an
# `authorization` header rule. This cluster runs istio ambient, where ztunnel
# cannot evaluate HTTP attributes, so that rule is dropped and only the
# ingress-gateway rule survives -- which blackholes calls from the notebook.
#
# This grants the notebook ServiceAccount identity at L4, which ztunnel does
# enforce. Apply with:
#
#     kubectl apply -f allow-notebook-kfp.yaml
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-notebook-to-ml-pipeline-ui
  namespace: kubeflow
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: ml-pipeline-ui
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/kubeflow-user-example-com/sa/default-editor
